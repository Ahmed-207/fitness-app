<div class="floating-agent" role="complementary" [attr.aria-label]="'ASSISTANT.ARIA' | translate">
  <span class="floating-agent__label">{{ 'ASSISTANT.LABEL' | translate }}</span>
  <button type="button" class="floating-agent__trigger" [attr.aria-label]="'ASSISTANT.LABEL' | translate">
    <span class="floating-agent__glow" aria-hidden="true"></span>
    <img
      class="floating-agent__figure"
      src="/assets/home/fitness-agent.png"
      alt=""
      width="202"
      height="197"
    />
  </button>
</div>
