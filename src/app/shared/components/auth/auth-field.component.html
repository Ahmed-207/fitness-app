<div class="field-block">
  <label
    class="field"
    [class.field--invalid]="invalid() && error()"
  >
    @if (icon() === 'user') {
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="3.2" />
        <path d="M5.5 20v-1.2a6.5 6.5 0 0 1 13 0V20" />
      </svg>
    } @else {
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m4 7 8 6 8-6" />
      </svg>
    }
    @if (labelKey()) {
      <span class="visually-hidden">{{ labelKey()! | translate }}</span>
    }
    <input
      [type]="type()"
      [value]="value"
      [disabled]="disabled"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode()"
      [placeholder]="placeholder()"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
  </label>
  @if (invalid() && error()) {
    <small class="field-error">{{ error()! | translate }}</small>
  }
</div>
