<div class="field-block">
  <label
    class="field password-field"
    [class.field--invalid]="invalid() && error()"
  >
    <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="5" y="10" width="14" height="11" rx="2" />
      <path d="M8 10V7a4 4 0 0 1 8 0v3" />
    </svg>
    @if (labelKey()) {
      <span class="visually-hidden">{{ labelKey()! | translate }}</span>
    }
    <span class="password-wrap">
      <input
        [type]="showPassword() ? 'text' : 'password'"
        [value]="value"
        [disabled]="disabled"
        [attr.autocomplete]="autocomplete()"
        [placeholder]="placeholder()"
        (input)="onInput($event)"
        (blur)="onBlur()"
      />
      <button
        class="password-toggle"
        type="button"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="
          (showPassword() ? hidePasswordLabelKey() : showPasswordLabelKey()) | translate
        "
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12s3.2-6 9.5-6 9.5 6 9.5 6-3.2 6-9.5 6-9.5-6-9.5-6Z" />
          <circle cx="12" cy="12" r="2.6" />
        </svg>
      </button>
    </span>
  </label>
  @if (invalid() && error()) {
    <small class="field-error">{{ error()! | translate }}</small>
  }
</div>
