<div class="marquee-strip" aria-hidden="true">
  <div class="marquee-strip__track">
    @for (repeat of [1, 2]; track repeat) {
      <div class="marquee-strip__group">
        @for (item of items; track $index) {
          <span class="marquee-strip__item">
            {{ item | translate }}
            <span class="marquee-strip__sep" aria-hidden="true">✦</span>
          </span>
        }
      </div>
    }
  </div>
</div>
