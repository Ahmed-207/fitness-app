<div class="flex flex-col items-center justify-center w-full text-white">
  <h1 class="text-3xl font-black tracking-wider mb-8 text-white text-center">
    {{ 'RESET_PASS.TITLE' | translate }}
  </h1>

  <div class="w-full max-w-105 rounded-[35px] border border-gray-500/40 bg-[#1E1E1E]/40 p-8 backdrop-blur-xl shadow-2xl flex flex-col items-center">
    
    <p class="text-gray-200 text-sm font-semibold text-center mb-8">
      {{ 'RESET_PASS.SUBTITLE' | translate }}
    </p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-5">
      
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>

        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          [placeholder]="'RESET_PASS.NEW_PASSWORD_PLACEHOLDER' | translate"
          class="w-full rounded-full bg-transparent border border-gray-500/60 pl-11 pr-11 py-3 text-sm text-white placeholder-gray-400 focus:border-[#FF5722] focus:outline-none transition"
        />

        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>

        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmPassword"
          [placeholder]="'RESET_PASS.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
          class="w-full rounded-full bg-transparent border border-gray-500/60 pl-11 pr-11 py-3 text-sm text-white placeholder-gray-400 focus:border-[#FF5722] focus:outline-none transition"
        />

        <button
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
          class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>

      <button
        type="submit"
        [disabled]="resetForm.invalid"
        class="w-full rounded-full bg-[#FF5722] hover:bg-[#E64A19] py-3 mt-4 text-white font-bold text-base shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ 'RESET_PASS.DONE_BTN' | translate }}
      </button>

    </form>
  </div>
</div>
