<section class="reset-page" aria-labelledby="reset-title">
  <h1 id="reset-title" class="reset-page-title">{{ 'RESET_PASS.TITLE' | translate }}</h1>

  <div class="reset-panel">
    <app-auth-back-button route="/auth/verify-otp" />
    <p class="reset-lead">{{ 'RESET_PASS.SUBTITLE' | translate }}</p>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form" novalidate>
      <app-auth-password-field
        formControlName="password"
        autocomplete="new-password"
        [placeholder]="'RESET_PASS.NEW_PASSWORD_PLACEHOLDER' | translate"
        showPasswordLabelKey="AUTHLOGIN.SHOW_PASSWORD"
        hidePasswordLabelKey="AUTHLOGIN.HIDE_PASSWORD"
        [invalid]="resetForm.controls.password.touched && resetForm.controls.password.invalid"
        [error]="passwordError()"
      />

      <app-auth-password-field
        formControlName="confirmPassword"
        autocomplete="new-password"
        [placeholder]="'RESET_PASS.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
        showPasswordLabelKey="AUTHLOGIN.SHOW_PASSWORD"
        hidePasswordLabelKey="AUTHLOGIN.HIDE_PASSWORD"
        [invalid]="
          resetForm.controls.confirmPassword.touched &&
          (resetForm.controls.confirmPassword.invalid || resetForm.hasError('passwordMismatch'))
        "
        [error]="confirmPasswordError()"
      />

      <app-auth-form-error [message]="apiError.message()" />

      <app-auth-primary-button type="submit" [disabled]="resetForm.invalid || isSubmitting()">
        {{ 'RESET_PASS.DONE_BTN' | translate }}
      </app-auth-primary-button>
    </form>
  </div>
</section>
