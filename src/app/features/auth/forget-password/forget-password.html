<div class="flex flex-col items-center justify-center w-full text-white">

  <h1 class="text-3xl font-extrabold tracking-wider mb-6 text-white text-center">
    {{ 'AUTHPASSWORD.FORGOT_PASS_TITLE' | translate }}
  </h1>

  <div class="w-full max-w-105 rounded-[35px] border border-gray-500/40 bg-[#1E1E1E]/40 p-8 backdrop-blur-xl shadow-2xl flex flex-col items-center">
    
    <p class="text-gray-300 text-xs text-center mb-6 leading-relaxed">
      {{ 'AUTHPASSWORD.FORGOT_PASS_SUBTITLE' | translate }}
    </p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="w-full flex flex-col gap-5">
      

      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <input
          type="email"
          formControlName="email"
          placeholder="{{'AUTHPASSWORD.EMAIL_PLACEHOLDER' | translate}}"
          class="w-full rounded-full bg-transparent border border-gray-500/60 pl-11 pr-4 py-3 text-sm text-white placeholder-gray-400 focus:border-[#FF5722] focus:outline-none transition"
        />
      </div>

      <button
        type="submit"
        [disabled]="forgotForm.invalid"
        class="w-full rounded-full bg-[#FF5722] hover:bg-[#E64A19] py-3 mt-2 text-white font-bold text-sm shadow-lg transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ 'AUTHPASSWORD.SEND_CODE_BTN' | translate }}
      </button>

      <div class="text-center mt-2 text-xs text-gray-300">
        <a routerLink="/auth/login" class="text-[#FF5722] hover:underline font-semibold">
          ← {{ 'AUTHPASSWORD.BACK_TO_LOGIN' | translate }}
        </a>
      </div>

    </form>
  </div>
</div>
