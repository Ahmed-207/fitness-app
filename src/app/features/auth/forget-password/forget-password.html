<section class="forgot-page" aria-labelledby="forgot-title">
  <h1 id="forgot-title" class="forgot-page-title">{{ 'AUTHPASSWORD.FORGOT_PASS_TITLE' | translate }}</h1>

  <div class="forgot-panel">
    <app-auth-back-button route="/auth/login" [labelKey]="'AUTHPASSWORD.BACK_TO_LOGIN'" />
    <p class="forgot-lead">{{ 'AUTHPASSWORD.FORGOT_PASS_SUBTITLE' | translate }}</p>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form" novalidate>
      <app-auth-field
        formControlName="email"
        icon="email"
        type="email"
        autocomplete="email"
        inputmode="email"
        [placeholder]="'AUTHPASSWORD.EMAIL_PLACEHOLDER' | translate"
        [invalid]="forgotForm.controls.email.touched && forgotForm.controls.email.invalid"
        [error]="emailError()"
      />

      <app-auth-form-error [message]="apiError.message()" />

      <app-auth-primary-button type="submit" [disabled]="forgotForm.invalid || isSubmitting()">
        {{ 'AUTHPASSWORD.SEND_CODE_BTN' | translate }}
      </app-auth-primary-button>
    </form>
  </div>
</section>
