<section class="otp-page" aria-labelledby="otp-title">
  <h1 id="otp-title" class="otp-page-title">{{ 'OTP.TITLE' | translate }}</h1>

  <div class="otp-panel">
    <app-auth-back-button route="/auth/forget-password" />
    <p class="otp-lead">{{ 'OTP.SUBTITLE' | translate }}</p>

    <form [formGroup]="otpForm" (ngSubmit)="onVerify()" class="otp-form" novalidate>
      <div class="otp-row" formGroupName="otpInputs">
        <input
          #input1
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit1.value"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="1"
          formControlName="digit1"
          (keyup)="onDigitInput($event, input2, null)"
        />
        <input
          #input2
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit2.value"
          type="text"
          inputmode="numeric"
          maxlength="1"
          formControlName="digit2"
          (keyup)="onDigitInput($event, input3, input1)"
        />
        <input
          #input3
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit3.value"
          type="text"
          inputmode="numeric"
          maxlength="1"
          formControlName="digit3"
          (keyup)="onDigitInput($event, input4, input2)"
        />
        <input
          #input4
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit4.value"
          type="text"
          inputmode="numeric"
          maxlength="1"
          formControlName="digit4"
          (keyup)="onDigitInput($event, input5, input3)"
        />
        <input
          #input5
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit5.value"
          type="text"
          inputmode="numeric"
          maxlength="1"
          formControlName="digit5"
          (keyup)="onDigitInput($event, input6, input4)"
        />
        <input
          #input6
          class="otp-digit"
          [class.otp-digit--filled]="otpForm.controls.otpInputs.controls.digit6.value"
          type="text"
          inputmode="numeric"
          maxlength="1"
          formControlName="digit6"
          (keyup)="onDigitInput($event, null, input5)"
        />
      </div>

      <app-auth-form-error [message]="apiError.message()" />

      <app-auth-primary-button type="submit" [disabled]="otpForm.invalid || isSubmitting()">
        {{ 'OTP.CONFIRM_BTN' | translate }}
      </app-auth-primary-button>

      <p class="auth-resend">
        <span>{{ 'OTP.RESEND_PROMPT' | translate }}</span>
        <button
          type="button"
          class="auth-text-button"
          (click)="resendCode()"
          [disabled]="isResending() || isSubmitting()"
        >
          {{ 'OTP.RESEND_LINK' | translate }}
        </button>
      </p>
    </form>
  </div>
</section>
