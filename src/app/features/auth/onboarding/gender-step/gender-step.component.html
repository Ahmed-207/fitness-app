<h1 id="step-title" class="gender-title">{{ 'ONBOARDING.GENDER_TITLE' | translate }}</h1>
<p class="intro">{{ 'ONBOARDING.GENDER_INTRO' | translate }}</p>
<div class="gender-grid" role="group" [attr.aria-label]="'ONBOARDING.CHOOSE_PROFILE' | translate">
  <button
    type="button"
    class="gender-card"
    [class.selected]="selected() === 'male'"
    [attr.aria-pressed]="selected() === 'male'"
    (click)="selectedChange.emit('male')"
  >
    <span class="gender-symbol" aria-hidden="true">♂</span
    ><span>{{ 'ONBOARDING.MALE' | translate }}</span>
  </button>
  <button
    type="button"
    class="gender-card"
    [class.selected]="selected() === 'female'"
    [attr.aria-pressed]="selected() === 'female'"
    (click)="selectedChange.emit('female')"
  >
    <span class="gender-symbol" aria-hidden="true">♀</span
    ><span>{{ 'ONBOARDING.FEMALE' | translate }}</span>
  </button>
</div>
