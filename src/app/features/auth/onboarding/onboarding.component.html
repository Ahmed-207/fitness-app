<app-onboarding-chrome
  [step]="step()"
  [canContinue]="hasAnswer()"
  [isSubmitting]="isSubmitting()"
  (back)="back()"
  (nextStep)="next()"
>
  @switch (step()) {
    @case (0) {
      <app-gender-step [selected]="gender()" (selectedChange)="gender.set($event)" />
    }
    @case (1) {
      <app-measurement-step
        title="ONBOARDING.AGE_TITLE"
        caption="ONBOARDING.YEAR"
        [value]="age()"
        [minimum]="16"
        [maximum]="100"
        ariaLabel="ONBOARDING.AGE_ARIA"
        unitSuffix="ONBOARDING.UNIT_YEARS"
        (valueChange)="age.set($event)"
      />
    }
    @case (2) {
      <app-measurement-step
        title="ONBOARDING.WEIGHT_TITLE"
        captionMode="units"
        [caption]="metric() ? 'ONBOARDING.KG' : 'ONBOARDING.LB'"
        [unitAriaLabel]="
          metric() ? 'ONBOARDING.WEIGHT_UNITS_METRIC' : 'ONBOARDING.WEIGHT_UNITS_IMPERIAL'
        "
        [units]="units()"
        [value]="shownWeight()"
        [minimum]="metric() ? 30 : 66"
        [maximum]="metric() ? 250 : 550"
        [ariaLabel]="metric() ? 'ONBOARDING.WEIGHT_ARIA_METRIC' : 'ONBOARDING.WEIGHT_ARIA_IMPERIAL'"
        [unitSuffix]="metric() ? 'ONBOARDING.UNIT_KILOGRAMS' : 'ONBOARDING.UNIT_POUNDS'"
        (unitsChange)="units.set($event)"
        (valueChange)="onWeight($event)"
      />
    }
    @case (3) {
      <app-measurement-step
        title="ONBOARDING.HEIGHT_TITLE"
        captionMode="units"
        [caption]="metric() ? 'ONBOARDING.CM' : 'ONBOARDING.FT_IN'"
        [unitAriaLabel]="
          metric() ? 'ONBOARDING.HEIGHT_UNITS_METRIC' : 'ONBOARDING.HEIGHT_UNITS_IMPERIAL'
        "
        [units]="units()"
        [value]="shownHeight()"
        [minimum]="metric() ? 120 : 47"
        [maximum]="metric() ? 230 : 90"
        [ariaLabel]="metric() ? 'ONBOARDING.HEIGHT_ARIA_METRIC' : 'ONBOARDING.HEIGHT_ARIA_IMPERIAL'"
        [unitSuffix]="metric() ? 'ONBOARDING.UNIT_CENTIMETRES' : 'ONBOARDING.UNIT_INCHES'"
        [feet]="metric() ? null : shownHeightFeet()"
        [inches]="metric() ? null : shownHeightInches()"
        (unitsChange)="units.set($event)"
        (valueChange)="onHeight($event)"
      />
    }
    @case (4) {
      <app-option-step
        title="ONBOARDING.GOAL_TITLE"
        groupLabel="ONBOARDING.GOAL_GROUP"
        [options]="goals"
        [selected]="goal()"
        (selectedChange)="chooseGoal($event)"
      />
    }
    @default {
      <app-option-step
        title="ONBOARDING.ACTIVITY_TITLE"
        groupLabel="ONBOARDING.ACTIVITY_GROUP"
        [options]="activityLevels"
        [selected]="activity()"
        (selectedChange)="chooseActivity($event)"
      />
    }
  }
</app-onboarding-chrome>
