<div class="step-topline">
  <button class="back-button" type="button" (click)="back.emit()" aria-label="Go back">
    ← <span>Back</span>
  </button>
  @if (step() === 0) {
    <span
      class="step-count first-step-count"
      role="progressbar"
      aria-valuenow="1"
      aria-valuemin="1"
      aria-valuemax="6"
      aria-label="Step 1 of 6"
    >
      1/6
    </span>
  } @else {
    <span
      class="step-count step-ring"
      role="progressbar"
      [attr.aria-valuenow]="stepNumber()"
      aria-valuemin="1"
      aria-valuemax="6"
      [attr.aria-label]="'Step ' + stepNumber() + ' of 6'"
    >
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="step-ring-track" cx="32" cy="32" r="27" />
        <circle
          class="step-ring-progress"
          cx="32"
          cy="32"
          r="27"
          [attr.stroke-dashoffset]="progressOffset()"
        />
      </svg>
      <span>{{ stepNumber() }}/6</span>
    </span>
  }
</div>

<ng-content />

@if (errorMessage()) {
  <p class="form-error" role="alert">{{ errorMessage() }}</p>
}
<button
  class="primary-button"
  type="button"
  [disabled]="!canContinue() || isSubmitting()"
  (click)="nextStep.emit()"
>
  {{ continueLabel() }}
</button>
<p class="secure-note">
  <span aria-hidden="true">◆</span> Your information is encrypted and secure
</p>
