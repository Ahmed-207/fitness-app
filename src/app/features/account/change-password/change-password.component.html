<main class="detail-page">
  <section class="detail-panel" aria-labelledby="password-title">
    <a class="back-link" routerLink="/account">‹ {{ 'ACCOUNT.COMMON.BACK' | translate }}</a>
    <p class="eyebrow">{{ 'ACCOUNT.PASSWORD.EYEBROW' | translate }}</p>
    <h1 id="password-title">{{ 'ACCOUNT.PASSWORD.TITLE' | translate }}</h1>
    <p class="lead">{{ 'ACCOUNT.PASSWORD.DESCRIPTION' | translate }}</p>

    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <label>
        <span>{{ 'ACCOUNT.PASSWORD.CURRENT' | translate }}</span>
        <input
          [type]="showPasswords() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        @if (form.controls.currentPassword.touched && form.controls.currentPassword.invalid) {
          <small class="field-error">{{ 'ACCOUNT.PASSWORD.CURRENT_REQUIRED' | translate }}</small>
        }
      </label>
      <label>
        <span>{{ 'ACCOUNT.PASSWORD.NEW' | translate }}</span>
        <input
          [type]="showPasswords() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
          <small class="field-error">{{ 'ACCOUNT.PASSWORD.RULE' | translate }}</small>
        }
      </label>
      <label>
        <span>{{ 'ACCOUNT.PASSWORD.CONFIRM' | translate }}</span>
        <input
          [type]="showPasswords() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
        @if (
          form.controls.confirmPassword.touched &&
          (form.controls.confirmPassword.invalid || form.hasError('passwordMismatch'))
        ) {
          <small class="field-error">{{ 'ACCOUNT.PASSWORD.MISMATCH' | translate }}</small>
        }
      </label>

      <label class="checkbox-row">
        <input
          type="checkbox"
          [checked]="showPasswords()"
          (change)="showPasswords.set(!showPasswords())"
        />
        <span>{{ 'ACCOUNT.PASSWORD.SHOW' | translate }}</span>
      </label>

      @if (error()) {
        <p class="status status--error" role="alert">{{ error() }}</p>
      }
      @if (saved()) {
        <p class="status status--success" role="status">
          {{ 'ACCOUNT.PASSWORD.SAVED' | translate }}
        </p>
      }

      <button class="primary-button" type="submit" [disabled]="form.invalid || isSaving()">
        {{ (isSaving() ? 'ACCOUNT.PASSWORD.SAVING' : 'ACCOUNT.PASSWORD.SAVE') | translate }}
      </button>
    </form>
  </section>
</main>
